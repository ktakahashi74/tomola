  - id: E39
    category: terminology
    from: ja
    source: { kind: example }
    title: 三重の灯と観測の独立性
    text: |
      観測の独立性は、装置を離すだけでは得られない。設計上の共通点も調べる必要がある。

      ここでいう三重の灯（英語では Lantern Triad）は、別々の装置、別々の判定手順、別々の記録経路を指す私の呼び名である。三重の灯は安全を保証する原理ではなく、共通の失敗を探す作業の枠組みである。

      ## 離隔運用期

      離隔運用期には装置の記録を分ける。続く再接続期には、到達確度則を仮説として検討する。ここでの「型」は記録の分類を指し、予測モデルを指さない。
    weight: heavy
    to: [en]
    checks:
      - { id: E39-C1, kind: semantic, description: '題と本文の「三重の灯」は、著者が英語として指定した Lantern Triad にそろえる。Three Lights などへ別訳しない。' }
      - { id: E39-C2, kind: semantic, description: 'Lantern Triad は著者の造語。安全の保証ではなく、共通の失敗を探す枠組みという限定を保つ。' }
      - { id: E39-C3, kind: semantic, description: '「型」は分類であり予測モデルではない。到達確度則は仮説であって確立した法則ではない。' }
  - id: E40
    category: terminology
    from: ja
    source: { kind: example }
    respondsTo: E39
    title: 三重の灯では足りない
    text: |
      前の論考の三重の灯には賛成しない。離隔運用期から再接続期へ移る条件が書かれていないからである。

      到達確度則は、装置の独立性ではなく、記録の型の違いから調べるべきではないか。三重の灯という呼び名は使うが、安全の保証としては扱わない。
