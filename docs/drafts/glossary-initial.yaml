# Optional glossary sample matching docs/drafts/glossary-initial.md. Preserve the
# multilingual candidates and notes; the Markdown file is the human-readable reference.
# Import: pnpm glossary:import docs/drafts/glossary-initial.yaml
# Creates every direction between the five languages, idempotently. Format and
# export round-trip rules: app/lib/glossary-io.server.ts.
# terms: candidate forms by language; source punctuation and parentheses are retained.
# note: contextual guidance. keep_original: languages that may retain the source form.
# needs_review: target languages whose candidates still need review. Operators should
# review all language choices with their members, including those not listed here.
format: tomola-glossary
version: 1
entries:

  # AI alignment
  - terms:
      en: ["AI alignment"]
      ja: ["AIアライメント", "AIアラインメント"]
      fr: ["alignement de l'IA"]
      zh-Hans: ["AI对齐", "人工智能对齐"]
      zh-Hant: ["AI對齊", "人工智慧對齊"]
    note: "「整列」「配置」とは訳さない。日本語の表記は「アライメント」と「アラインメント」が併存する。場では「アライメント」を先に挙げる。"
    keep_original: []
    needs_review: [fr, zh-Hans, zh-Hant]

  # AI safety
  - terms:
      en: ["AI safety"]
      ja: ["AI安全性", "AIの安全性"]
      fr: ["sûreté de l'IA"]
      zh-Hans: ["AI安全", "人工智能安全"]
      zh-Hant: ["AI安全", "人工智慧安全"]
    note: "safety（事故や意図しない害を防ぐこと）と security（攻撃から守ること）を区別する。仏語は sûreté（safety）と sécurité（security）で分ける。中国語はどちらも「安全」になりやすいので、区別が要る文脈では注記を足す。"
    keep_original: []
    needs_review: [fr, zh-Hans, zh-Hant]

  # AI security
  - terms:
      en: ["AI security"]
      ja: ["AIセキュリティ"]
      fr: ["sécurité de l'IA"]
      zh-Hans: ["AI安全防护", "人工智能安全防护"]
      zh-Hant: ["AI資安", "人工智慧資訊安全"]
    note: "AI safety（事故や意図しない害を防ぐこと）と取り違えない。こちらは、攻撃から守ることを指す。"
    keep_original: []
    needs_review: [fr, zh-Hans, zh-Hant]

  # interpretability
  - terms:
